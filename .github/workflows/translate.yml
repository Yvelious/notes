name: Auto Translate RU → EN/DE (stable)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, 'Auto translations')" # защита от зацикливания
    runs-on: ubuntu-latest

    steps:
      # === Подготовка окружения ===
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install chatgpt-md-translator
        run: npm install -g chatgpt-md-translator

      # === Поиск изменённых файлов ===
      - name: 🔍 Detect changed RU markdown files
        id: changes
        run: |
          git fetch origin ${{ github.ref_name }} --depth=20 || true
          CHANGED_FILES=$(git log -m -1 --name-only --pretty=format: "${{ github.sha }}" | grep '^content/ru/.*\.md$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(find content/ru -type f -name "*.md" || true)
          fi
          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # === Перевод RU → EN ===
      - name: 🌐 Translate RU → EN
        if: steps.changes.outputs.files != ''
        run: |
          echo "🌍 Переводим на английский..."
          # создаём конфиг в рабочей директории (repo root)
          cat > .chatgpt-md-translator.json <<'EOF'
          {
            "openaiApiKey": "${{ secrets.OPENAI_API_KEY }}",
            "defaultLanguage": "en",
            "defaultModel": "gpt-4o-mini",
            "overwrite": true
          }
          EOF

          echo "${{ steps.changes.outputs.files }}" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            target=$(echo "$file" | sed 's|content/ru|content/en|')
            mkdir -p "$(dirname "$target")"
            echo "🔁 Translating: '$file' → '$target'"
            # запускаем утилиту из текущего каталога, где лежит конфиг
            (cd "$(pwd)" && chatgpt-md-translator "$file" "$target")
          done

      # === Перевод RU → DE ===
      - name: 🇩🇪 Translate RU → DE
        if: steps.changes.outputs.files != ''
        run: |
          echo "🇩🇪 Переводим на немецкий..."
          # создаём конфиг в рабочей директории
          cat > .chatgpt-md-translator.json <<'EOF'
          {
            "openaiApiKey": "${{ secrets.OPENAI_API_KEY }}",
            "defaultLanguage": "de",
            "defaultModel": "gpt-4o-mini",
            "overwrite": true
          }
          EOF

          echo "${{ steps.changes.outputs.files }}" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            target=$(echo "$file" | sed 's|content/ru|content/de|')
            mkdir -p "$(dirname "$target")"
            echo "🔁 Translating: '$file' → '$target'"
            (cd "$(pwd)" && chatgpt-md-translator "$file" "$target")
          done

      # === Коммит переведённых файлов ===
      - name: 💾 Commit translated files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add content/en content/de || true
          git commit -m "Auto translations (only changed files)" || echo "No new translations"
          git push || echo "Push skipped"
