name: Auto Translate RU → EN/DE (smart)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, 'Auto translations')" # 🛑 защита от циклов
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10 # берём больше коммитов для git diff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install chatgpt-md-translator
        run: npm install -g chatgpt-md-translator

      - name: Detect changed RU markdown files
        id: changes
        run: |
          echo "🧭 Current branch: ${{ github.ref_name }}"
          echo "⬅️ Before commit: ${{ github.event.before }}"
          echo "➡️ After commit:  ${{ github.sha }}"

          git fetch origin ${{ github.ref_name }} --depth=10 || true