name: Auto Translate to EN & DE

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Translate RU → EN
        uses: SMikitky/chatgpt-md-translator@v1
        with:
          source: "content/ru"
          target: "content/en"
          to: "en"
          overwrite: "true"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Translate RU → DE
        uses: SMikitky/chatgpt-md-translator@v1
        with:
          source: "content/ru"
          target: "content/de"
          to: "de"
          overwrite: "true"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-translate new RU content to EN & DE" || echo "No changes"
          git push
