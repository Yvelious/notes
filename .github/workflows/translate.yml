name: Auto Translate RU → EN/DE (stable)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, 'Auto translations')" # защита от зацикливания
    runs-on: ubuntu-latest

    steps:
      # === Подготовка окружения ===
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install chatgpt-md-translator
        run: npm install -g chatgpt-md-translator

      # === Поиск изменённых файлов ===
      - name: 🔍 Detect changed RU markdown files
        id: changes
        run: |
          echo "🧭 Branch: ${{ github.ref_name }}"
          git fetch origin ${{ github.ref_name }} --depth=20 || true

          CHANGED_FILES=$(git log -m -1 --name-only --pretty=format: "${{ github.sha }}" | grep '^content/ru/.*\.md$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "⚠️ Нет изменений — берём все RU-файлы"
            CHANGED_FILES=$(find content/ru -type f -name "*.md" || true)
          fi

          echo "📄 Найденные RU-файлы:"
          echo "$CHANGED_FILES"

          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 🧩 Debug changed files
        run: |
          if [ -z "${{ steps.changes.outputs.files }}" ]; then
            echo "⚠️ Нет изменённых .md файлов в content/ru/"
          else
            echo "✅ Найдены файлы для перевода:"
            echo "${{ steps.changes.outputs.files }}"
          fi

      # === Перевод RU → EN ===
      - name: 🌐 Translate RU → EN
        if: steps.changes.outputs.files != ''
        run: |
          echo "🌍 Переводим на английский..."
          # Конфиг переводчика
          cat > ~/.chatgpt-md-translator.json <<'EOF'
          {
            "defaultLanguage": "en",
            "defaultModel": "gpt-4o-mini",
            "overwrite": true
          }
          EOF

          echo "${{ steps.changes.outputs.files }}" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            target=$(echo "$file" | sed 's|content/ru|content/en|')
            mkdir -p "$(dirname "$target")"
            echo "🔁 Translating: '$file' → '$target'"
            chatgpt-md-translator "$file" "$target"
          done

      # === Перевод RU → DE ===
      - name: 🇩🇪 Translate RU → DE
        if: steps.changes.outputs.files != ''
        run: |
          echo "🇩🇪 Переводим на немецкий..."
          # Конфиг переводчика
          cat > ~/.chat
