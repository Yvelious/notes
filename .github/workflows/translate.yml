name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install openai@4.0.0 fs-extra glob

      - name: Translate changed RU markdown files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          import fs from "fs-extra";
          import glob from "glob";
          import OpenAI from "openai";

          const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const ruFiles = glob.sync("content/ru/**/*.md");

          async function translateText(text, lang) {
            const res = await openai.chat.completions.create({
              model: "gpt-4o-mini",
              messages: [
                { role: "system", content: `Translate the following Markdown text from Russian to ${lang}. Preserve formatting and code blocks.` },
                { role: "user", content: text },
              ],
            });
            return res.choices[0].message.content;
          }

          for (const file of ruFiles) {
            const text = fs.readFileSync(file, "utf8");
            const base = file.replace(/^content\/ru\//, "");

            for (const lang of ["en", "de"]) {
              const outPath = `content/${lang}/${base}`;
              fs.ensureDirSync(outPath.replace(/\/[^/]+$/, ""));
              console.log(`🌍 Translating ${file} → ${outPath}`);
              const translated = await translateText(text, lang);
              fs.writeFileSync(outPath, translated, "utf8");
            }
          }
          NODE

      - name: Commit translated files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add content/en content/de || true
          git commit -m "Auto translations" || echo "No new translations"
          git push || echo "Push skipped"
