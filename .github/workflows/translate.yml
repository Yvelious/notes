name: Auto Translate RU → EN/DE

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install translator
        run: npm install -g chatgpt-md-translator

      - name: Translate RU → EN
        run: |
          chatgpt-md-translator \
            --from ru \
            --to en \
            --source content/ru \
            --target content/en \
            --overwrite \
            --model gpt-4o-mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Translate RU → DE
        run: |
          chatgpt-md-translator \
            --from ru \
            --to de \
            --source content/ru \
            --target content/de \
            --overwrite \
            --model gpt-4o-mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit translated files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto translations (RU→EN/DE)" || echo "No changes"
          git push