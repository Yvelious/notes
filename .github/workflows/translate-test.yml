name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # этого достаточно

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install openai fs-extra glob

      - name: Determine changed RU files and translate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔍 Определяем изменённые файлы..."
          # Подтянем ветку main для сравнения
          git fetch origin main --depth=2 || true
          
          echo "📂 Последние коммиты:"
          git log --oneline -3 || true
          
          echo "🧩 Ищем изменения в content/ru/"
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD | grep '^content/ru/.*\.md$' || true)

          if [ -z "$CHANGED" ]; then
            echo "⚠️ Изменений не найдено, берём все RU-файлы"
            CHANGED=$(find content/ru -type f -name '*.md' | sort)
          fi

          echo "📄 Файлы для перевода:"
          echo "$CHANGED"

          node <<'NODE'
          import fs from "fs-extra";
          import { glob } from "glob";
          import OpenAI from "openai";

          const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const changed = process.env.CHANGED
            ? process.env.CHANGED.split("\n").filter(Boolean)
            : glob.sync("content/ru/**/*.md");

          console.log("📄 Файлы для перевода:\n", changed.join("\n"));

          NODE
