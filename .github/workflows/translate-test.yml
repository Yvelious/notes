name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    branches:
      - v4
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 10  # возьмём немного истории, чтобы diff работал

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install openai fs-extra glob

      - name: Detect changed RU markdown files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔍 Определяем изменения..."
          git config core.quotepath false  # важная строка!
          git fetch origin v4 --depth=10 || true

          echo "📂 Последние коммиты:"
          git log --oneline -5 || true

          echo "🧩 Проверяем изменения за последние 7 коммитов"
          CHANGED=$(git diff --name-only --diff-filter=ACMR HEAD~7..HEAD | grep '^content/ru/.*\.md$' || true)

          if [ -z "$CHANGED" ]; then
            echo "⚠️ Не найдено изменений, берём все RU-файлы"
            CHANGED=$(find content/ru -type f -name '*.md' | sort)
          fi

          echo "📄 Файлы для перевода:"
          echo "$CHANGED"

          echo "CHANGED<<EOF" >> $GITHUB_ENV
          echo "$CHANGED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

