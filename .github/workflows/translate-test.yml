name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install openai fs-extra glob

      - name: Translate changed RU markdown files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          import fs from "fs-extra";
          import { glob } from "glob";
          import OpenAI from "openai";
          import { execSync } from "child_process";

          const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          
          git config core.quotepath false  # важная строка!


          // --- Определяем изменённые файлы ---
          let changed = [];
          try {
            const diff = execSync("git diff --name-only HEAD^ HEAD").toString();
            changed = diff.split("\n").filter(f => f.startsWith("content/ru/") && f.endsWith(".md"));
          } catch {
            console.log("⚠️ Не удалось определить изменения, переводим все RU-файлы");
          }

          if (changed.length === 0) {
            changed = glob.sync("content/ru/**/*.md");
          }

          console.log("📄 Файлы для перевода:\n", changed.join("\n"));

          async function translateText(text, lang) {
            const res = await openai.chat.completions.create({
              model: "gpt-4o-mini",
              messages: [
                { role: "system", content: `Translate the following Markdown text from Russian to ${lang}. Preserve formatting and code blocks.` },
                { role: "user", content: text }
              ]
            });
            return res.choices[0].message.content;
          }

          for (const file of changed) {
            const text = fs.readFileSync(file, "utf8");
            const base = file.replace(/^content\/ru\//, "");

            for (const lang of ["en", "de"]) {
              const outPath = `content/${lang}/${base}`;
              fs.ensureDirSync(outPath.replace(/\/[^/]+$/, ""));
              console.log(`🌍 Translating ${file} → ${outPath}`);
              const translated = await translateText(text, lang);
              fs.writeFileSync(outPath, translated, "utf8");
            }
          }
          NODE