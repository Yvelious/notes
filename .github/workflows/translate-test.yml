name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install openai fs-extra glob

      - name: Translate changed RU markdown files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
        run: |
          echo "🔍 BEFORE: $GIT_BEFORE"
          echo "🔍 AFTER:  $GIT_AFTER"

          # гарантируем наличие обоих коммитов локально
          echo "📥 Fetching previous commit..."
          git fetch origin $GIT_BEFORE --depth=1 || echo "⚠️ Не удалось fetch предыдущий коммит"

          node <<'NODE'
          import fs from "fs-extra";
          import { glob } from "glob";
          import OpenAI from "openai";
          import { execSync } from "child_process";

          const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const before = process.env.GIT_BEFORE;
          const after = process.env.GIT_AFTER;

          let changed = [];

          try {
            if (!before || before === "0000000000000000000000000000000000000000") {
              console.log("🟡 Первый коммит — берём все RU-файлы");
            } else {
              console.log(`🔍 Сравниваем ${before} → ${after}`);
              const diff = execSync(`git diff --name-only --diff-filter=ACMR ${before} ${after}`).toString();
              changed = diff.split("\n").filter(f => f.startsWith("content/ru/") && f.endsWith(".md"));
              console.log("🧩 Найдено изменённых файлов:", changed.length);
            }
          } catch (e) {
            console.log("⚠️ Ошибка diff:", e.message);
          }

          if (changed.length === 0) {
            console.log("⚠️ Не удалось определить изменения, переводим все RU-файлы");
            changed = glob.sync("content/ru/**/*.md");
          }

          console.log("📄 Файлы для перевода:\n", changed.join("\n"));

          NODE
