name: Detect Changed RU Files (JS)

on:
  push:
    paths:
      - "content/ru/**/*.md"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.detect.outputs.files }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enable correct handling of Cyrillic paths
        run: git config core.quotepath false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed RU .md files
        id: detect
        env:
          GITHUB_OUTPUT: ${{ runner.temp }}/.github_output
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const outputPath = process.env.GITHUB_OUTPUT;

          let changed = [];
          try {
            const diff = execSync('git diff --name-only HEAD^ HEAD', { encoding: 'utf8' }).trim();
            changed = diff
              .split('\n')
              .map(line => line.trim())
              .filter(line => line.startsWith('content/ru/') && line.endsWith('.md'))
              .filter(Boolean);
          } catch (err) {
            console.log('Первый коммит или нет diff — продолжаем без изменений');
          }

          if (changed.length === 0) {
            console.log('Нет изменённых .md файлов в content/ru/');
          } else {
            console.log('Изменённые файлы:');
            changed.forEach(f => console.log('  ' + f));
          }

          // Записываем в environment file (новый способ)
          const filesList = changed.join(',');
          fs.appendFileSync(outputPath, `files=${filesList}\n`);
          JS