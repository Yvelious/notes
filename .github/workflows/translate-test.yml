name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    branches:
      - v4
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 10  # возьмём немного истории, чтобы diff работал

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install openai fs-extra glob

      - name: Detect changed RU markdown files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔍 Определяем изменения относительно origin/v4"
          git fetch origin v4 --depth=10 || echo "⚠️ Не удалось fetch origin/v4"

          echo "📂 Последние коммиты:"
          git log --oneline -10 || true

          echo "🧩 Ищем изменения в content/ru/"
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/v4...HEAD || true)

          # Если не найдено — проверяем последние 5 коммитов
          if [ -z "$CHANGED" ]; then
            git config core.quotepath false
            CHANGED=$(git diff --name-only --diff-filter=ACMR HEAD~7..HEAD | grep '^content/ru/.*\.md$'
          fi

          # Если всё равно пусто — берём все RU-файлы
          if [ -z "$CHANGED" ]; then
            echo "⚠️ Всё ещё пусто — берём все RU-файлы"
            CHANGED=$(find content/ru -type f -name '*.md' | sort)
          fi

          echo "📄 Файлы для перевода:"
          echo "$CHANGED"

          echo "CHANGED<<EOF" >> $GITHUB_ENV
          echo "$CHANGED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Translate changed files via OpenAI
        if: ${{ env.CHANGED != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          import fs from "fs-extra";
          import { glob } from "glob";
          import OpenAI from "openai";

          const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const changed = process.env.CHANGED
            ? process.env.CHANGED.split("\n").filter(Boolean)
            : glob.sync("content/ru/**/*.md");

          console.log("📄 Файлы для перевода:\n", changed.join("\n"));
          NODE
