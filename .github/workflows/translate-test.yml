name: Detect Changed RU Files (JS)

on:
  push:
    paths:
      - "content/ru/**/*.md"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.detect.outputs.files }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Нужно для HEAD^

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed RU .md files
        id: detect
        run: |
          node - <<'JS'
          const { execSync } = require('child_process');

          let changed = [];
          try {
            const diff = execSync('git diff --name-only HEAD^ HEAD', { encoding: 'utf8' }).trim();
            changed = diff
              .split('\n')
              .filter(Boolean);
          } catch (err) {
            console.log('Нет предыдущего коммита (первый push)');
          }

          if (changed.length === 0) {
            console.log('Нет изменённых .md файлов в content/ru/');
          } else {
            console.log('Изменённые файлы:');
            changed.forEach(f => console.log('  ' + f));
          }
          // Выводим как JSON-массив для GITHUB_OUTPUT
          const output = changed.join(',');
          console.log(`::set-output name=files::${output}`);
          JS