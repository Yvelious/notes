name: Auto Translate RU → EN/DE (via OpenAI API)

on:
  push:
    paths:
      - "content/ru/**/*.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужно для доступа к HEAD^

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install openai fs-extra glob

      - name: Translate changed RU markdown files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          import fs from "fs-extra";
          import { glob } from "glob";
          import OpenAI from "openai";
          import { execSync } from "child_process";

          const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const before = process.env.BEFORE;
          const after = process.env.AFTER;

          console.log("🔍 BEFORE:", before);
          console.log("🔍 AFTER:", after);

          let changed = [];

          try {
            if (!before || before === "0000000000000000000000000000000000000000") {
              console.log("🟡 Похоже, это первый коммит. Возьмём все RU-файлы.");
            } else {
              const diff = execSync(`git diff --name-only --diff-filter=ACMR ${before} ${after}`).toString();
              changed = diff
                .split("\n")
                .filter(f => f.startsWith("content/ru/") && f.endsWith(".md"));
            }
          } catch (e) {
            console.log("⚠️ Ошибка diff:", e.message);
          }

          NODE
